<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Watch Together</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hidden-until-ready {
            display: none;
        }
        #player-wrapper {
            display: none;
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #youtube-player {
            width: 100%;
            height: 100%;
        }
        #video-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
            margin-top: 15px;
        }
        .video-card {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: scale(1.03);
            background: #333333;
        }
        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
        }
        .video-card p {
            font-size: 13px;
            margin: 6px 0 0 0;
            color: #ddd;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .code-display {
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
            letter-spacing: 2px;
        }
        button {
            padding: 8px 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="text"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube Watch Together</h1>

        <div class="card">
            <p>Senin Kodun: <span id="myCode" class="code-display">------</span></p>
        </div>

        <div class="card" id="connection-section">
            <h3>Arkadaşına Bağlan</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="targetCodeInput" placeholder="Arkadaşın kodu (örn: 123456)" style="flex: 1;">
                <button onclick="sendConnectionRequest()" style="background: #4CAF50;">İstek Gönder</button>
            </div>
        </div>

        <div class="card" id="requests-section">
            <h3>Gelenler Listesi</h3>
            <div id="incoming-requests">
                <p>- Henüz gelen bağlantı isteği yok.</p>
            </div>
        </div>

        <div class="card hidden-until-ready" id="room-section">
            <h3>İzleme Alanı</h3>
            
            <div id="player-wrapper">
                <div id="youtube-player"></div>
            </div>

            <div style="margin: 15px 0; display: flex; gap: 10px;">
                <input type="text" id="searchInput" placeholder="YouTube'da başka bir şey ara..." style="flex: 1;">
                <button onclick="searchVideos()" style="background: #2196F3;">Ara</button>
            </div>
            
            <h4>Videolar</h4>
            <div id="video-list"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
