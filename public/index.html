<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Watch Together</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- YÜKLENİYOR OVERLAY -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p id="loading-text">İşlem Yapılıyor, Lütfen Bekleyin...</p>
    </div>

    <!-- PARTNER CANLI FARE İMLECİ -->
    <div id="remote-cursor" class="remote-cursor" style="display: none;">
        <div class="cursor-pointer"></div>
        <span id="remote-cursor-label" class="cursor-label">Partner</span>
    </div>

    <div class="container">
        <!-- KURULUM VE BAĞLANTI KARTI -->
        <div id="setup-card" class="card">
            <h1>YouTube Watch Together</h1>
            
            <div id="connection-section">
                <p>Senin Kodun: <strong id="myCode" class="code-badge">------</strong></p>
                <hr>
                <h3>Arkadaşına Bağlan</h3>
                <div class="input-group">
                    <input type="text" id="targetCodeInput" placeholder="Arkadaşının 6 haneli kodu">
                    <button onclick="sendConnectionRequest()">İstek Gönder</button>
                </div>
            </div>

            <div id="requests-section">
                <h3>Gelen İstekler</h3>
                <div id="incoming-requests"></div>
            </div>
        </div>

        <!-- ODA VE VİDEO ALANI -->
        <div id="room-section" style="display: none;">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="YouTube'da video ara..." onkeydown="if(event.key==='Enter') searchVideos()">
                <button onclick="searchVideos()">Ara</button>
            </div>

            <div class="watch-layout">
                <!-- SOL OYNATICI (ÖZEL KONTROLLER DAHİL) -->
                <div id="player-container" class="player-container" style="display: none;">
                    <div id="player-wrapper">
                        <div id="youtube-player"></div>
                        
                        <!-- ÖZEL KONTROL KATMANI -->
                        <div id="custom-controls-overlay" class="custom-controls-overlay">
                            <button id="custom-play-btn" class="custom-play-btn" onclick="togglePlayPause()">
                                <span id="play-btn-icon">▶</span>
                            </button>
                            <button id="custom-fullscreen-btn" class="custom-fullscreen-btn" onclick="toggleCustomFullscreen()">
                                ⛶
                            </button>
                        </div>
                    </div>
                </div>

                <!-- SAĞ / TAM GENİŞLİK VİDEO LİSTESİ -->
                <div id="video-list-container" class="video-list-container">
                    <h3 id="list-title">Önerilen Videolar</h3>
                    <div id="video-list" class="video-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
